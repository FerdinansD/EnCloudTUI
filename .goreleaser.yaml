version: 2

project_name: encloud-tui

builds:
  - id: encloud-tui
    main: ./cmd/encloud-tui
    binary: encloud-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .Commit }} -X main.date={{ .CommitDate }}

archives:
  - id: encloud-tui
    ids:
      - encloud-tui
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - id: archives
    artifacts: archive

release:
  github:
    owner: FerdinansD
    name: EnCloudTUI

brews:
  - repository:
      owner: FerdinansD
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: encloud-tui
    homepage: "https://github.com/FerdinansD/EnCloudTUI"
    description: "Terminal UI for deliberate Engram Cloud synchronization"
    license: "MIT"
    commit_msg_template: "chore: update encloud-tui formula to {{ .Tag }}"
